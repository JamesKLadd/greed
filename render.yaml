# Render Blueprint for the Greed online server (@greed/server).
# The server speaks WebSocket (game traffic) + a tiny HTTP layer for health checks.
# Deploy: on render.com -> New -> Blueprint -> pick this repo. Free plan sleeps after
# ~15 min idle (first connect then cold-starts ~30-50s), which is fine for casual play.
services:
  - type: web
    name: greed-server
    runtime: node
    plan: free
    # Install the whole workspace so @greed/core|bots|protocol resolve; tsx runs the TS.
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # --- Accounts (set the secret values in the Render dashboard) ---
      # Neon Postgres connection string (from Vercel → Storage → Neon, or Neon
      # dashboard). Accounts stay disabled until this is set.
      - key: DATABASE_URL
        sync: false
      # Long random string used to sign session tokens. MUST be stable across
      # restarts or everyone gets logged out. Generate e.g. `openssl rand -hex 32`.
      - key: JWT_SECRET
        sync: false
      # Public site URL. Used for BOTH the email verification/reset links and the
      # CORS allowlist, so it must be the origin players actually load the site
      # from. Change it here as well as in the dashboard when you move domains —
      # a `value:` in this blueprint OVERWRITES the dashboard on the next sync,
      # so a dashboard-only edit silently reverts and links start 404ing.
      - key: APP_URL
        value: https://playgreed.vercel.app
      # Extra browser origins allowed to call the API (comma-separated). The app's
      # *.vercel.app domains and APP_URL are already allowed by default.
      - key: ALLOWED_ORIGINS
        sync: false
      # Optional email delivery (verification + reset). Leave unset to keep email
      # disabled (links are logged server-side). Needs a verified sender domain.
      # NOTE a key WITHOUT a verified EMAIL_FROM is Resend's sandbox, which only
      # delivers to your own account address — the boot log says so.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Whether new accounts must confirm their email before they count as
      # verified. OFF unless this is exactly "true" AND mail is configured: a
      # confirmation step that can't be delivered strands every new account
      # unverified with no way out. Turn on once a sender domain is verified.
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
