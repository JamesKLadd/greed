[package]
name = "app"
version = "0.6.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
# Off by default so the standard `tauri:build` compiles with no Steamworks SDK
# and no App ID. Enable with `--features steam` once you have a Steam partner
# App ID and the SDK in place (see steam/README.md).
steam = ["dep:steamworks"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Pulled in only when the `steam` feature is enabled.
steamworks = { version = "0.11", optional = true }
