<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-maskable.svg" />
    <meta name="theme-color" content="#12161e" />
    <title>Greed — the push-your-luck dice game</title>
    <meta
      name="description"
      content="Five dice. One more roll. Play Greed’s daily and weekly challenges, share your score, and bring friends to an online table."
    />
    <meta property="og:title" content="Greed — the push-your-luck dice game" />
    <meta property="og:description" content="Roll. Risk it. Bank it — before it all slips away." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://playgreed.vercel.app/marketing/greed-social.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Self-hosted type. Preloaded because the splash below paints the wordmark
         before any JS runs; stable (versioned) filenames make this possible and
         let the service worker precache them by name. -->
    <link
      rel="preload"
      href="/fonts/fraunces-var-v1.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/nunito-sans-var-v1.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Must mirror @font-face in styles/tokens.css: the splash paints before
         the stylesheet loads, so it needs its own declaration. */
      @font-face {
        font-family: "Fraunces";
        src: url("/fonts/fraunces-var-v1.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-display: swap;
      }
      /* Pre-React loading splash — replaced when the app mounts. */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      /* Must mirror --room-* and --lamp in styles/tokens.css. This paints before
         the stylesheet exists, so a mismatch here is a visible colour flash on
         every cold load. */
      body {
        background:
          radial-gradient(120% 70% at 50% -8%, rgba(255, 214, 150, 0.1), transparent 64%),
          linear-gradient(180deg, #1c212b, #12161e 46%, #0a0d13);
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #splash .logo {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 900;
        letter-spacing: 2px;
        font-size: 64px;
        color: #f6dfae;
        text-shadow:
          0 1px 0 rgba(0, 0, 0, 0.5),
          0 3px 0 rgba(0, 0, 0, 0.4),
          0 10px 26px rgba(0, 0, 0, 0.7);
      }
      #splash .spin {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(246, 223, 174, 0.22);
        border-top-color: #f6dfae;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .spin {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <div class="logo">GREED</div>
        <div class="spin"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
