<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-maskable.svg" />
    <meta name="theme-color" content="#0a3d26" />
    <title>Greed — the push-your-luck dice game</title>
    <meta
      name="description"
      content="Greed — a push-your-luck 5-dice game. Play local co-op or against bots, or take it online."
    />
    <meta property="og:title" content="Greed — the push-your-luck dice game" />
    <meta property="og:description" content="Roll. Risk it. Bank it — before it all slips away." />
    <meta property="og:type" content="website" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <style>
      /* Pre-React loading splash — replaced when the app mounts. */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: radial-gradient(120% 120% at 50% 0%, #0f5132 0%, #0a3d26 55%, #062a1a 100%);
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #splash .logo {
        font-family: Georgia, serif;
        font-weight: 800;
        letter-spacing: 6px;
        font-size: 64px;
        color: #f5c451;
        text-shadow:
          0 2px 0 #c9971f,
          0 8px 24px rgba(0, 0, 0, 0.4);
      }
      #splash .spin {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(245, 196, 81, 0.25);
        border-top-color: #f5c451;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <div class="logo">GREED</div>
        <div class="spin"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
